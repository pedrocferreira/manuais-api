<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso — Manuais de Serviço</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=9" />
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🔧 Manuais de Serviço</h1>
      <p class="subtitle">Consulte o acervo completo de manuais técnicos.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login">Entrar</button>
        <button class="auth-tab" id="tab-register">Cadastrar-se</button>
      </div>

      <!-- FORMULARIO DE LOGIN -->
      <form id="login-form">
        <label for="username">Usuário</label>
        <input type="text" id="username" autocomplete="username" required autofocus
          placeholder="Digite seu usuário..." />
        <label for="password">Senha</label>
        <input type="password" id="password" autocomplete="current-password" required
          placeholder="Digite sua senha..." />
        <div class="error-box" id="error-box" style="display:none;"></div>
        <button type="submit" class="primary" id="submit-btn">Entrar no Sistema</button>
      </form>

      <!-- FORMULARIO DE CADASTRO -->
      <form id="register-form" style="display:none;">
        <label for="reg-username">Escolha um Usuário</label>
        <input type="text" id="reg-username" autocomplete="username" placeholder="Mínimo 3 caracteres..." required />
        <label for="reg-password">Crie uma Senha</label>
        <input type="password" id="reg-password" autocomplete="new-password" placeholder="Mínimo 4 caracteres..."
          required />
        <label for="reg-confirm">Confirme a Senha</label>
        <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="Repita a senha..." required />

        <label style="margin-top:20px;margin-bottom:4px;">Escolha seu Plano</label>
        <div class="plan-picker" id="plan-picker">
          <!-- Preenchido via JS -->
          <p style="color:var(--text-dim);font-size:0.85rem;">Carregando planos...</p>
        </div>

        <div class="error-box" id="reg-error-box" style="display:none;"></div>
        <button type="submit" class="primary" id="reg-submit-btn">Criar Minha Conta</button>
        <p style="font-size:0.75rem;color:var(--text-dim);margin-top:12px;text-align:center;">
          Após o cadastro, um administrador ativará o seu plano.
        </p>
      </form>


    </div>
  </div>

  <script>
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");

    let selectedPlanId = null;

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabRegister.classList.remove("active");
      loginForm.style.display = "block";
      registerForm.style.display = "none";
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.classList.add("active");
      tabLogin.classList.remove("active");
      loginForm.style.display = "none";
      registerForm.style.display = "block";
      loadPlans();
    });

    // Carregar planos disponíveis
    async function loadPlans() {
      const picker = document.getElementById("plan-picker");
      try {
        const res = await fetch("/api/plans");
        const plans = await res.json();
        if (!plans.length) {
          picker.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">Nenhum plano disponível no momento.</p>';
          return;
        }
        picker.innerHTML = plans.map(p => `
          <label class="plan-card" id="plan-card-${p.id}" onclick="selectPlan(${p.id})">
            <input type="radio" name="plan" value="${p.id}" />
            <div class="plan-radio-dot"></div>
            <div class="plan-card-body">
              <div class="plan-card-header">
                <span class="plan-card-name">${escapeHtml(p.name)}</span>
                <span class="plan-card-price">R$ ${Number(p.price).toFixed(2).replace('.', ',')}<small style="font-size:0.7rem;color:var(--text-dim);font-weight:400;">/mês</small></span>
              </div>
              <div class="plan-card-desc">${escapeHtml(p.description || '')}</div>
            </div>
          </label>
        `).join("");
        // Selecionar o primeiro automaticamente
        if (plans.length > 0) selectPlan(plans[0].id);
      } catch (e) {
        picker.innerHTML = '<p style="color:var(--text-dim);font-size:0.85rem;">Não foi possível carregar os planos.</p>';
      }
    }

    window.selectPlan = function(id) {
      selectedPlanId = id;
      document.querySelectorAll(".plan-card").forEach(c => c.classList.remove("selected"));
      const card = document.getElementById("plan-card-" + id);
      if (card) {
        card.classList.add("selected");
        card.querySelector("input[type=radio]").checked = true;
      }
    };

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // SUBMIT LOGIN
    const errorBox = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          errorBox.textContent = data.detail || "Usuário ou senha inválidos.";
          errorBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Entrar no Sistema";
          return;
        }
        const data = await res.json();
        if (data.is_admin) {
          window.location.href = "/admin";
        } else {
          window.location.href = "/";
        }
      } catch (err) {
        errorBox.textContent = "Não foi possível conectar ao servidor.";
        errorBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar no Sistema";
      }
    });

    // SUBMIT CADASTRO
    const regErrorBox = document.getElementById("reg-error-box");
    const regSubmitBtn = document.getElementById("reg-submit-btn");

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      regErrorBox.style.display = "none";

      const pass = document.getElementById("reg-password").value;
      const confirm = document.getElementById("reg-confirm").value;

      if (pass !== confirm) {
        regErrorBox.textContent = "As senhas não conferem.";
        regErrorBox.style.display = "block";
        return;
      }

      regSubmitBtn.disabled = true;
      regSubmitBtn.textContent = "Criando conta...";

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("reg-username").value.trim(),
            password: pass,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          regErrorBox.textContent = data.detail || "Erro ao criar conta.";
          regErrorBox.style.display = "block";
          regSubmitBtn.disabled = false;
          regSubmitBtn.textContent = "Criar Minha Conta";
          return;
        }
        window.location.href = "/";
      } catch (err) {
        regErrorBox.textContent = "Não foi possível conectar ao servidor.";
        regErrorBox.style.display = "block";
        regSubmitBtn.disabled = false;
        regSubmitBtn.textContent = "Criar Minha Conta";
      }
    });
  </script>
</body>

</html>
