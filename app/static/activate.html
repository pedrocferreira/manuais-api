<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ative o acesso da sua compra." />
  <link rel="icon" href="/static/img/xtreme-logo.png" />
  <title>Ativar acesso — Xtreme Manuais AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=14" />
</head>

<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-brand">
        <img src="/static/img/xtreme-logo-light.png" alt="Xtreme Mototech" width="499" height="108" />
        <span>Manuais <b>AI</b></span>
      </div>
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/>
          </svg>
        </div>
        <h1>Ativar acesso</h1>
      </div>
      <p class="login-subtitle">
        Comprou pelo link e ainda não tem senha? Informe o e-mail usado na compra e crie a sua.
      </p>

      <form id="activate-form" autocomplete="on" novalidate>
        <div class="form-group">
          <label for="email">E-mail da compra</label>
          <input type="email" id="email" autocomplete="email" required
            placeholder="o mesmo e-mail do Kiwify…" autofocus />
        </div>
        <div class="form-group">
          <label for="cpf">4 últimos dígitos do CPF</label>
          <input type="text" id="cpf" inputmode="numeric" maxlength="4"
            placeholder="ex: 1234" />
        </div>
        <div class="form-group">
          <label for="password">Crie uma senha</label>
          <input type="password" id="password" autocomplete="new-password" required
            placeholder="Mínimo 4 caracteres…" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirme a senha</label>
          <input type="password" id="confirm" autocomplete="new-password" required
            placeholder="Repita a senha…" />
        </div>

        <div class="error-box" id="error-box" style="display:none;" role="alert"></div>
        <button type="submit" class="primary" id="submit-btn">
          <span id="submit-label">Ativar e entrar</span>
        </button>
      </form>

      <div style="margin-top:24px; text-align:center;">
        <a href="/login" style="color:var(--text-dim); font-size:var(--font-sm);">Já tenho conta — entrar</a>
      </div>
    </div>
  </div>

  <script>
    const form      = document.getElementById("activate-form");
    const errorBox  = document.getElementById("error-box");
    const submitBtn = document.getElementById("submit-btn");
    const submitLbl = document.getElementById("submit-label");

    // Pre-preenche o e-mail se vier do link da pagina de obrigado do Kiwify
    const emailParam = new URLSearchParams(location.search).get("email");
    if (emailParam) document.getElementById("email").value = emailParam;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitLbl.textContent = "Ativar e entrar";
      submitBtn.querySelector(".spinner")?.remove();
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errorBox.style.display = "none";

      const email    = document.getElementById("email").value.trim();
      const cpf      = document.getElementById("cpf").value.trim();
      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;

      if (password !== confirm) return showError("As senhas não conferem.");
      if (password.length < 4)  return showError("A senha deve ter pelo menos 4 caracteres.");

      submitBtn.disabled = true;
      submitLbl.textContent = "Ativando…";
      submitBtn.insertAdjacentHTML("afterbegin", '<span class="spinner" style="width:14px;height:14px;"></span>');

      try {
        const res = await fetch("/auth/activate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, cpf_last4: cpf || null })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Não foi possível ativar.");
        window.location.href = "/";
      } catch (err) {
        showError(err.message || "Erro ao ativar a conta.");
      }
    });
  </script>
</body>
</html>
