<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manuais de Serviço — Motos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <h1>🔧 Manuais de Serviço — Motos</h1>
    <div class="user-box">
      <button class="btn-secondary" id="suggest-manual-btn">📤 Sugerir Manual</button>
      <a href="/admin" class="btn-admin" id="admin-panel-link" style="display:none;">⚙️ Painel Admin</a>
      <span id="username-label"></span>
      <button class="logout" id="logout-btn">Sair</button>
    </div>
  </header>

  <aside class="sidebar">
    <input type="search" id="filter-input" placeholder="Filtrar por marca ou modelo..." />
    <div id="manual-list"></div>
  </aside>

  <main class="content" id="content">
    <div class="empty-state">Selecione uma moto na lista ao lado.</div>
  </main>
</div>

<!-- Modal para envio de sugestão de manual -->
<div id="suggest-modal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h2>📤 Sugerir / Enviar Manual</h2>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <form id="suggest-form">
      <p class="modal-desc">Não encontrou a sua moto no acervo? Envie o PDF do manual para análise de nossos administradores.</p>
      
      <div class="form-group">
        <label for="suggest-brand">Marca</label>
        <input type="text" id="suggest-brand" required placeholder="Ex: Honda, Yamaha, BMW..." />
      </div>

      <div class="form-group">
        <label for="suggest-model">Modelo</label>
        <input type="text" id="suggest-model" required placeholder="Ex: XRE 300, Fazer 250..." />
      </div>

      <div class="form-group">
        <label for="suggest-year">Ano</label>
        <input type="text" id="suggest-year" required placeholder="Ex: 2021" />
      </div>

      <div class="form-group">
        <label for="suggest-file">Arquivo PDF</label>
        <input type="file" id="suggest-file" accept=".pdf" required />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Cancelar</button>
        <button type="submit" class="btn-primary" id="suggest-submit-btn">Enviar Manual</button>
      </div>
      <div id="suggest-status" class="form-status"></div>
    </form>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script src="/static/app.js?v=4"></script>
</body>
</html>
